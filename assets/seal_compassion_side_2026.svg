<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Deep Cavity Dark Ground -->
    <radialGradient id="carbon-abyss" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="65%" stop-color="#08080a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Brilliant Warm Gold Jewel Fill -->
    <linearGradient id="warm-gold-jewel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="25%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="75%" stop-color="#ff8f00"/>
      <stop offset="100%" stop-color="#ff6f00"/>
    </linearGradient>

    <!-- Spectrum Covenant Rainbow Arc -->
    <linearGradient id="covenant-rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="17%" stop-color="#ff9100"/>
      <stop offset="34%" stop-color="#ffea00"/>
      <stop offset="51%" stop-color="#00e676"/>
      <stop offset="68%" stop-color="#00e5ff"/>
      <stop offset="85%" stop-color="#2979ff"/>
      <stop offset="100%" stop-color="#d500f9"/>
    </linearGradient>

    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .facet-edge { fill: #ffffff; fill-opacity: 0.03; stroke: #ffffff; stroke-opacity: 0.25; stroke-width: 1.5; }
    .facet-refl { fill: url(#covenant-rainbow); fill-opacity: 0.15; stroke: #ffffff; stroke-opacity: 0.4; }
    .compassion-sub { font-family: 'Cinzel', 'Trajan Pro', 'Georgia', serif; font-weight: 700; font-size: 32px; fill: #ffd54f; letter-spacing: 9px; }
  </style>

  <!-- Canvas Deep Ground -->
  <rect width="1000" height="1000" fill="#000000"/>

  <!-- Faceted Carbon Circumference -->
  <circle cx="500" cy="500" r="460" fill="url(#carbon-abyss)" stroke="#263238" stroke-width="4"/>

  <!-- Surrounding Diamond Prismatic Facets -->
  <g id="border-shards">
    <polygon points="500,40 610,95 500,165 390,95" class="facet-refl"/>
    <polygon points="610,95 765,150 670,240 500,165" class="facet-edge"/>
    <polygon points="765,150 865,260 760,345 670,240" class="facet-refl"/>
    <polygon points="865,260 940,395 825,455 760,345" class="facet-edge"/>
    <polygon points="940,395 960,500 840,500 825,455" class="facet-refl"/>
    <polygon points="960,500 940,605 825,545 840,500" class="facet-edge"/>
    <polygon points="940,605 865,740 760,655 825,545" class="facet-refl"/>
    <polygon points="865,740 765,850 670,760 760,655" class="facet-edge"/>
    <polygon points="765,850 610,905 500,835 670,760" class="facet-refl"/>
    <polygon points="610,905 500,960 390,905 500,835" class="facet-edge"/>
    <polygon points="500,960 390,905 330,760 500,835" class="facet-refl"/>
    <polygon points="390,905 235,850 240,655 330,760" class="facet-edge"/>
    <polygon points="235,850 135,740 175,545 240,655" class="facet-refl"/>
    <polygon points="135,740 60,605 160,500 175,545" class="facet-edge"/>
    <polygon points="60,605 40,500 160,500 160,500" class="facet-refl"/>
    <polygon points="40,500 60,395 175,455 160,500" class="facet-edge"/>
    <polygon points="60,395 135,260 240,345 175,455" class="facet-refl"/>
    <polygon points="135,260 235,150 330,240 240,345" class="facet-edge"/>
    <polygon points="235,150 390,95 500,165 330,240" class="facet-refl"/>
  </g>

  <!-- Core Directive: "BE NICE!" Rendered as Faceted Jewel Geometry -->
  <g id="jeweled-be-nice" filter="url(#gold-glow)">
    <!-- WORD: BE (Top Center) -->
    <g transform="translate(365, 295)">
      <!-- Letter 'B' -->
      <path d="M 0,0 L 70,0 C 95,0 110,12 110,32 C 110,48 98,58 82,62 C 104,66 118,78 118,100 C 118,124 98,136 70,136 L 0,136 Z M 32,28 L 32,52 L 65,52 C 75,52 80,46 80,38 C 80,31 74,28 65,28 Z M 32,80 L 32,108 L 68,108 C 78,108 85,102 85,94 C 85,86 78,80 68,80 Z" 
            fill="url(#warm-gold-jewel)" stroke="#ffffff" stroke-width="2"/>
      
      <!-- Letter 'E' -->
      <path d="M 155,0 L 245,0 L 245,28 L 187,28 L 187,54 L 238,54 L 238,82 L 187,82 L 187,108 L 247,108 L 247,136 L 155,136 Z" 
            fill="url(#warm-gold-jewel)" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- WORD: NICE! (Mid Center) -->
    <g transform="translate(205, 475)">
      <!-- Letter 'N' -->
      <path d="M 0,0 L 30,0 L 95,85 L 95,0 L 125,0 L 125,136 L 95,136 L 30,50 L 30,136 L 0,136 Z" 
            fill="url(#warm-gold-jewel)" stroke="#ffffff" stroke-width="2"/>

      <!-- Letter 'I' -->
      <path d="M 160,0 L 192,0 L 192,136 L 160,136 Z" 
            fill="url(#warm-gold-jewel)" stroke="#ffffff" stroke-width="2"/>

      <!-- Letter 'C' -->
      <path d="M 320,35 C 305,12 282,0 252,0 C 202,0 165,38 165,88 C 165,138 202,176 252,176 C 285,176 308,162 322,138 L 294,120 C 285,136 270,146 252,146 C 220,146 198,122 198,88 C 198,54 220,30 252,30 C 272,30 286,41 295,56 Z" 
            transform="translate(65, -20)" fill="url(#warm-gold-jewel)" stroke="#ffffff" stroke-width="2"/>

      <!-- Letter 'E' -->
      <path d="M 425,0 L 515,0 L 515,28 L 457,28 L 457,54 L 508,54 L 508,82 L 457,82 L 457,108 L 517,108 L 517,136 L 425,136 Z" 
            fill="url(#warm-gold-jewel)" stroke="#ffffff" stroke-width="2"/>

      <!-- Exclamation Point '!' -->
      <path d="M 545,0 L 575,0 L 570,95 L 550,95 Z M 545,114 L 575,114 L 575,138 L 545,138 Z" 
            fill="url(#warm-gold-jewel)" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Jewel Cluster Highlights -->
    <g fill="#ffffff">
      <circle cx="395" cy="305" r="4"/>
      <circle cx="475" cy="395" r="3"/>
      <circle cx="235" cy="485" r="4"/>
      <circle cx="585" cy="555" r="4"/>
      <circle cx="765" cy="485" r="5"/>
      <polygon points="560,470 568,485 585,485 570,495 575,510 560,500 545,510 550,495 535,485 552,485" fill="#ffffff"/>
    </g>
  </g>

  <!-- Subtitle Mandate -->
  <text x="500" y="685" text-anchor="middle" class="compassion-sub">THE COMPASSION SIDE</text>

  <!-- Covenant Rainbow Spectrum Arc (Principle 11: Care & Restitution) -->
  <g id="covenant-arc" transform="translate(500, 785)">
    <!-- Spectrum Band -->
    <path d="M -180,0 A 180,75 0 0,1 180,0" fill="none" stroke="url(#covenant-rainbow)" stroke-width="14" stroke-linecap="round"/>
    <!-- Outer Shimmer Guard -->
    <path d="M -185,-5 A 190,80 0 0,1 185,-5" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <!-- Central Prism Burst -->
    <circle cx="0" cy="-75" r="8" fill="#ffffff" filter="drop-shadow(0px 0px 8px #ffffff)"/>
  </g>
</svg>
